{% load static vl %}<ul class="tile-grid">
  {% for key, label in tiles %}{% with note=tile_notes|get_item:key %}
  {% if note %}<li class="tile-grid__wide"><a class="tile tile--wide" href="{% url 'core:designs' %}?gelegenheid={{ key }}">
    <span class="tile__img"><img src="{% static 'img/site/gelegenheid-'|add:key|add:'.webp' %}" alt="" width="1200" height="520" loading="lazy" decoding="async"></span>
    <span class="tile__body"><span class="tile__badge">Nieuw</span><span class="tile__label">{{ label }} {% icon "pijl" %}</span><span class="tile__note">{{ note }}</span></span>
  </a></li>
  {% else %}<li><a class="tile" href="{% url 'core:designs' %}?gelegenheid={{ key }}">
    <span class="tile__img"><img src="{% static 'img/site/gelegenheid-'|add:key|add:'.webp' %}" alt="" width="560" height="350" loading="lazy" decoding="async"></span>
    <span class="tile__label">{{ label }} {% icon "pijl" %}</span>
  </a></li>{% endif %}
  {% endwith %}{% endfor %}
</ul>
