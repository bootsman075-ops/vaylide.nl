{# Eén klep van de envelop. Elke klep draagt het hele reliëf; het knipvlak (clip-path) laat alleen het eigen deel zien. #}
<div class="wl-flap wl-flap--{{ klep }}" aria-hidden="true">
  <div class="wl-flap__face">
    <div class="wl-flap__emb"><span class="wl-emb wl-emb--boven"></span><span class="wl-emb wl-emb--links"></span><span class="wl-emb wl-emb--rechts"></span><span class="wl-emb wl-emb--krans"></span></div>
    <div class="wl-flap__goud"><span class="wl-emb wl-emb--boven"></span><span class="wl-emb wl-emb--links"></span><span class="wl-emb wl-emb--rechts"></span><span class="wl-emb wl-emb--krans"></span></div>
  </div>
  <div class="wl-flap__back"></div>
</div>
