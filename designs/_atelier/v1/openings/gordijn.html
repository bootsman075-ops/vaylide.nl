<section class="cover a-cover a-cover--gordijn a-names-{{ a.names }}" data-cover data-duration="2300" aria-label="Openingsscherm">
  <div class="a-curtain a-curtain--l" aria-hidden="true"></div>
  <div class="a-curtain a-curtain--r" aria-hidden="true"></div>
  <div class="a-cover__inner">
    {% include "_atelier/v1/parts/ornament.html" with pos="cover" %}
    <p class="a-cover__kicker">{{ v.kicker }}</p>
    <p class="a-cover__title a-cover__title--{{ v.names_size }}">{{ v.title }}</p>
    {% if v.date_numeric %}<p class="a-cover__date">{{ v.date_numeric }}</p>{% endif %}
    <a href="#uitnodiging" class="a-cover__btn" data-open>Open het doek</a>
    {% include "_atelier/v1/parts/music.html" %}
  </div>
</section>
