<section class="cover a-cover a-cover--sluier a-names-{{ a.names }}" data-cover data-duration="1900" data-fx-delay="180" aria-label="Openingsscherm">
  <div class="a-veil" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="fx-slot" data-fx-slot="cover" aria-hidden="true"></div>
  <div class="a-cover__inner" data-fx-origin>
    <p class="a-cover__kicker">{{ v.kicker }}</p>
    <p class="a-cover__title a-cover__title--{{ v.names_size }}">{{ v.title }}</p>
    {% if v.date_numeric %}<p class="a-cover__date">{{ v.date_numeric }}</p>{% endif %}
    <a href="#uitnodiging" class="a-cover__btn fx-pulse" data-open>Open de uitnodiging</a>
    {% include "_atelier/v1/parts/music.html" %}
  </div>
</section>
