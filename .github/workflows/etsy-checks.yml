name: Etsy-integratiecontroles

on:
  pull_request:
    paths:
      - "etsy_integration/**"
      - "tests/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/etsy-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django-checks:
    runs-on: ubuntu-latest
    env:
      VIERLIEF_MODE: test
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: "ci-only-etsy-integration-checks-not-for-production"
      VIERLIEF_DATA_DIR: /tmp/vaylide-ci
      VIERLIEF_SKIP_DOTENV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Ensure migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Run Django tests
        run: python manage.py test --noinput
