<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Vaylia merkbeelden</title>
<style>
@font-face { font-family: "Playfair Display"; src: url("../../static/fonts/playfair-display-latin-wght-normal.woff2") format("woff2"); font-weight: 400 900; }
@font-face { font-family: "Playfair Display"; src: url("../../static/fonts/playfair-display-latin-wght-italic.woff2") format("woff2"); font-weight: 400 900; font-style: italic; }
@font-face { font-family: "DM Sans"; src: url("../../static/fonts/dm-sans-latin-wght-normal.woff2") format("woff2"); font-weight: 100 1000; }
body { margin: 0; background: #fff; }
.frame { position: relative; overflow: hidden; margin: 0 0 20px; }
.mark { fill: none; stroke-linecap: round; stroke-linejoin: round; }
/* Deelafbeelding website */
#og-site { width: 1200px; height: 630px; background: #F9F0E6; }
#og-site .bg { position: absolute; inset: 0 0 0 36%; background: url("../../static/img/site/hero.webp") 60% 50% / cover; }
#og-site .bg::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #F9F0E6 0%, rgba(249,240,230,.6) 18%, rgba(249,240,230,0) 45%); }
#og-site .text { position: absolute; left: 80px; top: 64px; width: 600px; }
/* Het logo zoals aangeleverd (tools/logo). */
#og-site .logo { display: block; height: 170px; width: auto; margin: 0 0 40px -4px; }
#og-site h1 { font: 400 58px/1.14 "Playfair Display"; color: #26211D; margin: 0; letter-spacing: -.01em; }
#og-site h1 em { color: #7A5A2E; }
#og-site .card { position: absolute; right: 120px; top: 95px; width: 270px; height: 432px; border-radius: 20px; overflow: hidden; transform: rotate(5deg); box-shadow: 0 34px 60px -26px rgba(55,38,18,.55); background: url("../../static/img/site/kaart-voorbeeld.webp") top center / cover; }
/* Deelafbeelding uitnodiging */
#og-uitnodiging { width: 1200px; height: 630px; background: radial-gradient(circle at 50% 38%, #FFFDF9 0%, #F6EEE4 70%, #EFE3D4 100%); }
#og-uitnodiging .border { position: absolute; inset: 22px; border: 1.5px solid rgba(196,165,116,.55); border-radius: 6px; }
#og-uitnodiging .env { position: absolute; left: 50%; top: 92px; width: 420px; height: 270px; transform: translateX(-50%); background: linear-gradient(180deg, #F7EEE2, #EFE2D1); border-radius: 8px; box-shadow: 0 30px 50px -28px rgba(80,55,25,.45); overflow: hidden; }
#og-uitnodiging .flap { position: absolute; left: 0; right: 0; top: 0; height: 160px; background: linear-gradient(180deg, #F2E6D6, #EADBC6); clip-path: polygon(0 0, 100% 0, 50% 100%); }
#og-uitnodiging .seal { position: absolute; left: 50%; top: 210px; width: 92px; height: 92px; margin-left: -46px; border-radius: 50%; background: radial-gradient(circle at 38% 34%, #C9A56C 0%, #9C7743 60%, #7C5B30 100%); box-shadow: 0 6px 14px -4px rgba(60,40,15,.55), inset 0 0 0 5px rgba(255,255,255,.08); display: grid; place-items: center; }
#og-uitnodiging .title { position: absolute; left: 0; right: 0; top: 400px; text-align: center; font: 400 46px "Playfair Display"; color: #26211D; }
#og-uitnodiging .sub { position: absolute; left: 0; right: 0; top: 478px; text-align: center; font: 600 15px "DM Sans"; letter-spacing: .26em; text-transform: uppercase; color: #7A5A2E; }
/* Standaardafbeelding voor een nieuw ontwerp zonder eigen beeld */
#standaard { width: 800px; height: 1000px; background: radial-gradient(circle at 50% 40%, #FFFDF9 0%, #F5EEE6 75%, #EFE4D6 100%); }
#standaard .border { position: absolute; inset: 26px; border: 1.5px solid rgba(196,165,116,.6); border-radius: 8px; }
#standaard .center { position: absolute; left: 0; right: 0; top: 380px; display: grid; justify-items: center; gap: 22px; }
#standaard .name { font: 400 40px "Playfair Display"; color: #26211D; }
#standaard .sub { font: 600 15px "DM Sans"; letter-spacing: .26em; text-transform: uppercase; color: #6B625A; }
</style></head>
<body>

<div class="frame" id="og-site">
  <div class="bg"></div>
  <div class="card"></div>
  <div class="text">
    <img class="logo" src="../../static/img/merk/vaylia-logo.png" alt="">
    <h1>Een bijzondere dag verdient een <em>bijzondere</em> uitnodiging.</h1>
  </div>
</div>

<div class="frame" id="og-uitnodiging">
  <div class="border"></div>
  <div class="env"><div class="flap"></div></div>
  <div class="seal"><svg class="mark" viewBox="0 0 52 48" width="50" height="46" stroke="#FBF3E6" stroke-width="2.6" data-hart></svg></div>
  <div class="title">Je bent uitgenodigd</div>
  <div class="sub">Open de uitnodiging</div>
</div>

<div class="frame" id="standaard">
  <div class="border"></div>
  <div class="center">
    <svg class="mark" viewBox="0 0 52 48" width="84" height="78" stroke="#B8955F" stroke-width="1.8" data-hart></svg>
    <div class="name">Nieuw ontwerp</div>
    <div class="sub">Voorbeeld volgt</div>
  </div>
</div>
<script>
  // Hartje als versiering op het zegel en het standaardbeeld (het merkteken van vóór Vaylia).
  var hart = '<path d="M26 44C16.5 37.5 4 29 4 16.5 4 9.3 9.4 4 16 4c5.2 0 9 3.3 10 8.5C27 7.3 30.8 4 36 4c6.6 0 12 5.3 12 12.5C48 29 35.5 37.5 26 44Z"/>' +
    '<path d="M26 12.5c-4.8 5.2-6.6 11.6-3.4 17 1 1.7 2.2 3 3.4 3.9 1.2-.9 2.4-2.2 3.4-3.9 3.2-5.4 1.4-11.8-3.4-17Z"/>' +
    '<path d="M26 33.4V20.5"/>';
  document.querySelectorAll("[data-hart]").forEach(function (svg) { svg.innerHTML = hart; });
</script>
</body></html>
