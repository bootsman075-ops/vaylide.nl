<section class="cover a-cover a-cover--cadeau a-names-{{ a.names }}" data-cover data-duration="2600" data-fx-delay="470" aria-label="Openingsscherm">
  <div class="fx-slot" data-fx-slot="cover" aria-hidden="true"></div>
  <div class="a-cover__inner">
    <p class="a-cover__kicker">{{ v.kicker }}</p>
    <p class="a-cover__title a-cover__title--{{ v.names_size }}">{{ v.title }}</p>
    {% if v.date_numeric %}<p class="a-cover__date">{{ v.date_numeric }}</p>{% endif %}
    <div class="a-box a-box--{{ a.texture }}" data-open data-fx-tilt aria-hidden="true">
      <span class="a-box__body"><span class="a-box__band"></span></span>
      <span class="a-box__glow"></span>
      <span class="a-box__mouth" data-fx-origin></span>
      <span class="a-box__lid"><span class="a-box__band"></span><span class="a-box__bow"><i></i><i></i><b></b></span></span>
    </div>
    <a href="#uitnodiging" class="a-cover__btn fx-pulse" data-open>Pak het cadeau uit</a>
    {% include "_atelier/v1/parts/music.html" %}
  </div>
</section>
