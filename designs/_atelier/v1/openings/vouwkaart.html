<section class="cover a-cover a-cover--vouwkaart a-names-{{ a.names }}" data-cover data-duration="2200" aria-label="Openingsscherm">
  <div class="a-cover__inner">
    <div class="a-book">
      <div class="a-book__inside" aria-hidden="true"><span class="a-book__line">{{ v.tagline }}</span></div>
      <a href="#uitnodiging" class="a-book__front" data-open aria-label="Open de uitnodiging">
        <span class="a-book__content" aria-hidden="true">
          {% include "_atelier/v1/parts/ornament.html" with pos="cover" %}
          <span class="a-cover__kicker">{{ v.kicker }}</span>
          <span class="a-cover__title a-cover__title--{{ v.names_size }}">{{ v.title }}</span>
          {% if v.date_numeric %}<span class="a-cover__date">{{ v.date_numeric }}</span>{% endif %}
        </span>
      </a>
    </div>
    <p class="a-cover__hint">Tik op de kaart om hem open te vouwen</p>
    {% include "_atelier/v1/parts/music.html" %}
  </div>
</section>
